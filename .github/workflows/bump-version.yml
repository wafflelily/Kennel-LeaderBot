name: Bump version

# Every push to main increments the minor version in VERSION and commits the
# bump back. Bump the major manually by editing VERSION (e.g. to "2.0") —
# the workflow then continues from there (2.1, 2.2, ...).

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # Never bump the bump commit itself ([skip ci] already stops it, this is
    # belt and braces).
    if: "!startsWith(github.event.head_commit.message, 'Bump version to ')"
    steps:
      - uses: actions/checkout@v4

      - name: Increment minor version
        id: bump
        run: |
          major=$(cut -d. -f1 VERSION)
          minor=$(cut -d. -f2 VERSION)
          new="$major.$((minor + 1))"
          printf '%s\n' "$new" > VERSION
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push
